<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Critiktron</title>

<style>

body{
    margin:0;
    font-family: Arial, Helvetica, sans-serif;
    background:#f4f4f4;
    color:#333;
}

.container{
    max-width:900px;
    margin:auto;
    padding:30px;
}

.banner img{
    width:100%;
    height:auto;
    display:block;
    border-radius:12px;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#666;
    font-size:1.2rem;
    margin-bottom:25px;
}

h1{
    margin:0;
    text-align:center;
    color:#d2232a;
    font-size:3rem;
}

.subtitle{
    text-align:center;
    color:#666;
    margin-top:10px;
    margin-bottom:30px;
    font-size:1.2rem;
}

#phrase{
    background:white;
    border-radius:12px;
    padding:35px;
    min-height:110px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
    font-size:1.45rem;
    line-height:1.6;
    margin-bottom:25px;
}

.buttons{
    text-align:center;
}

button{
    border:none;
    border-radius:8px;
    padding:15px 25px;
    font-size:1rem;
    cursor:pointer;
    margin:5px;
}

.generate{
    background:#d2232a;
    color:white;
}

.generate:hover{
    background:#b71c23;
}

.copy{
    background:#555;
    color:white;
}

.copy:hover{
    background:#3e3e3e;
}

.footer{
    text-align:center;
    margin-top:30px;
    color:#888;
    font-size:0.9rem;
}

</style>
</head>
<body>

<div class="container">

    <div class="banner"><img src="https://github.com/bvanderschaeve-create/critiktron/blob/main/Critiktron.png?raw=true" alt="Bienvenue dans le Critiktron. 10.000 remarques constructives pour communicants !"/>
    
    </div>

    <h1>Critiktron</h1>

    <div class="subtitle">
        Le générateur de critiques pour communicants
    </div>

    <div id="phrase">
        Cliquez sur le bouton pour générer une remarque constructive.
    </div>

    <div class="buttons">
        <button class="generate" onclick="generer()">
            Générer une remarque constructive
        </button>

        <button class="copy" onclick="copierPhrase()">
            Copier la phrase
        </button>
    </div>

    <div class="footer">
        Toute ressemblance avec des commentaires réellement formulés serait totalement fortuite.
    </div>

</div>

<script>

const col1 = [
"Mon avis perso, c'est que",
"Je ne suis pas spécialiste, néanmoins,",
"Mon cousin Luc a vu le projet et pense que",
"Jean-Claude de la compta trouve que",
"Je ne suis pas là pour critiquer, toutefois,",
"Le groupe de travail s'est fait la réflexion que",
"J'ai juste une petite remarque :",
"Au café, on en a parlé et justement,",
"Si je peux me permettre un conseil,",
"Le Conseil d'Administration a fait observer que"
];

const col2 = [
"le logo en plus gros,",
"le petit dessin qu'on voulait au départ,",
"mettre du vert à la place du bleu,",
"la photo que je t'avais envoyée sous Word,",
"la proposition de notre stagiaire,",
"la version de l'année dernière,",
"le visuel que Fabienne a généré avec l'IA,",
"l'idée que t'avait suggérée le service contentieux,",
"dans un format un peu plus synthétique,",
"si tu prenais ce modèle PowerPoint,"
];

const col3 = [
"ce serait plus convivial,",
"ce serait plus percutant,",
"ça donnerait davantage de sens,",
"ça collerait mieux au contexte,",
"ce serait plus corporate,",
"ça aurait plus d'impact,",
"ça ferait plaisir à la femme du directeur,",
"ce serait plus conforme à l'image de l'entreprise,",
"ça véhiculerait mieux nos valeurs,",
"ce serait plus efficient,"
];

const col4 = [
"en tout cas c'est ce que j'aurais fait à ta place.",
"mais je te laisse décider en fonction.",
"mais on en reparle quand tu veux.",
"et ça te prendra 5 minutes.",
"bref, si tu peux faire encore 3 ou 4 variantes en ce sens.",
"je sais pas si je me fais bien comprendre.",
"et ça resterait dans le budget.",
"et ça remettrait l'humain au cœur de notre communication.",
"si jamais tu as encore le temps de corriger pour demain.",
"mais ce que tu as fait reste une bonne base de travail."
];

function hasard(tableau){
    return tableau[Math.floor(Math.random() * tableau.length)];
}

function generer(){

    const phrase =
        hasard(col1) + " " +
        hasard(col2) + " " +
        hasard(col3) + " " +
        hasard(col4);

    document.getElementById("phrase").innerText = phrase;
}

function copierPhrase(){

    const texte =
        document.getElementById("phrase").innerText;

    navigator.clipboard.writeText(texte);

    alert("Phrase copiée !");
}

</script>

</body>
</html>
</body>
</html>
